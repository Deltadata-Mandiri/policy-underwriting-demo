version: 1
applications:
  - appRoot: policy-ui
    backend:
      phases:
        build:
          commands:
            - npm ci --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        build:
          commands:
            # Point the static UI at the Function URL this branch's backend just deployed.
            - |
              node -e "
                const o = require('./amplify_outputs.json');
                const url = o.custom.conductorProxyUrl.replace(/\/+$/, '');
                require('fs').writeFileSync(
                  'public/config.js',
                  'window.APP_CONFIG = ' + JSON.stringify({ apiBase: url }) + ';\n'
                );
                console.log('apiBase ->', url);
              "
      artifacts:
        baseDirectory: public
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
